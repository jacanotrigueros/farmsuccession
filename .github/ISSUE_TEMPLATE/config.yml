# A blank issue is almost always a question, and a question has somewhere better to go than a tracker
# whose job is to carry evidence.
blank_issues_enabled: false
contact_links:
  - name: A question about the project, or about using the data
    url: https://farmsuccession.eu/about/
    about: What this is, how it is built, what the licence allows, and the address to write to.
  - name: Something that should not be reported in public
    url: https://github.com/jacanotrigueros/farmsuccession/security/policy
    about: A vulnerability, or anything that would expose somebody. SECURITY.md says how.
