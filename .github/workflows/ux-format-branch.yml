name: Format UX branch (temporary)
on:
  push:
    branches:
      - agent/chatgpt-ux-home-territories-20261110
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chatgpt-ux-home-territories-20261110
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm ci --prefix frontend
      - name: Format changed frontend files
        run: |
          npx prettier --write frontend/src/components/Needs.astro frontend/src/components/ResourceList.astro frontend/src/components/SearchView.astro 'frontend/src/pages/[...territory].astro' frontend/test/reporting.test.ts frontend/test/territory-presentation.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/Needs.astro frontend/src/components/ResourceList.astro frontend/src/components/SearchView.astro 'frontend/src/pages/[...territory].astro' frontend/test/reporting.test.ts frontend/test/territory-presentation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(frontend): format UX edits"
            git push origin HEAD:agent/chatgpt-ux-home-territories-20261110
          fi
